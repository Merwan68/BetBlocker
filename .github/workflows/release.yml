name: Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Build Signed / Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Decode Keystore (If provided via Secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK and App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          # If keystore does not exist, build debug-signed release or assembleRelease
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/ -name "*.apk" -exec cp {} release-assets/ \;
          find app/build/outputs/ -name "*.aab" -exec cp {} release-assets/ \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betshield-release-bundle
          path: release-assets/
          retention-days: 30
